
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZebraCall — проверка аналитики</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f8f5;
      padding: 35px 18px;
      color: #20342c;
    }
    main {
      max-width: 480px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00000010;
    }
    button {
      background: #176b4b;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled { opacity: .5; }
    #status { margin-top: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>🦓 ZebraCall Academy</h1>
    <h2>Проверка подключения</h2>
    <p>Отправляем только вымышленные результаты.</p>

    <button id="send">Отправить тестовый результат</button>
    <p id="status">Ожидаем проверки.</p>
  </main>

  <script>
    const endpoint =
      'https://script.google.com/macros/s/AKfycbw8bh86CRHyoqbpju5BSjhEvfJLzLTmmT4YE9U1ArpRhzNZlXU41rsJfQKh2YRqGPw/exec';

    document.getElementById('send').onclick = async () => {
      const button = document.getElementById('send');
      const status = document.getElementById('status');

      button.disabled = true;
      status.textContent = 'Отправляем тестовый запрос...';

      const payload = {
        testMode: true,
        score: 16,
        maxScore: 20,
        retryErrors: 2,
        statusErrors: 2,
        reviewTopics: 'Тест браузера ZebraCall'
      };

      try {
        await fetch(endpoint, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        status.textContent =
          'Запрос отправлен браузером. Теперь откройте Google Таблицу и проверьте, появилась ли новая строка с темой «Тест браузера ZebraCall».';
      } catch (error) {
        status.textContent =
          'Браузер не смог отправить запрос. Проверьте подключение.';
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
